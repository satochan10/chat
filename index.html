<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chat-container" class="chat-container" hidden>
    <header class="chat-header">
      <button id="back-btn" class="header-back-btn" type="button">←</button>
      <span id="chat-title">Chat</span>
      <button id="reload-btn" class="header-reload-btn" type="button" title="再読み込み">⟳</button>
    </header>
    <div id="messages" class="messages"></div>
    <form id="form" class="input-form">
      <input id="input" type="text" placeholder="メッセージを入力..." autocomplete="off" />
      <button id="send-btn" type="submit" disabled>送信</button>
    </form>
  </div>

  <div id="login-overlay" class="login-overlay">
    <form id="login-form" class="login-form">
      <div class="login-mascot">🐻</div>
      <h2>ログイン</h2>
      <p class="login-sub">なまえとパスワードを入力してね♪</p>
      <input id="login-name" type="text" placeholder="✏️ 名前" autocomplete="off" maxlength="20" />
      <input id="login-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="🔒 4桁のパスワード" autocomplete="off" />
      <p id="login-error" class="login-error"></p>
      <button type="submit">はじめる 💌</button>
    </form>
  </div>

  <div id="partner-overlay" class="login-overlay" hidden>
    <div class="login-form">
      <h2>誰とチャットしますか？</h2>
      <ul id="partner-list" class="partner-list"></ul>
      <p id="partner-empty" class="login-error"></p>
    </div>
  </div>

  <script type="module" src="script.js?v=2"></script>
</body>
</html>
