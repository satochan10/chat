<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chat-container" class="chat-container" hidden>
    <header class="chat-header">
      <button id="back-btn" class="header-back-btn" type="button">←</button>
      <span id="chat-title">Chat</span>
    </header>
    <div id="messages" class="messages"></div>
    <form id="form" class="input-form">
      <input id="input" type="text" placeholder="メッセージを入力..." autocomplete="off" />
      <button type="submit">送信</button>
    </form>
  </div>

  <div id="login-overlay" class="login-overlay">
    <form id="login-form" class="login-form">
      <h2>ログイン</h2>
      <input id="login-name" type="text" placeholder="名前" autocomplete="off" maxlength="20" />
      <input id="login-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4桁のパスワード" autocomplete="off" />
      <p id="login-error" class="login-error"></p>
      <button type="submit">はじめる</button>
    </form>
  </div>

  <div id="partner-overlay" class="login-overlay" hidden>
    <div class="login-form">
      <h2>誰とチャットしますか？</h2>
      <ul id="partner-list" class="partner-list"></ul>
      <p id="partner-empty" class="login-error"></p>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
